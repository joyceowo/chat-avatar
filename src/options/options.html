<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Avatar Overlay - Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #333;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #444;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background: #4CAF50;
      color: white;
    }

    .btn-primary:hover {
      background: #45a049;
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #d0d0d0;
    }

    .status-message {
      padding: 12px;
      border-radius: 4px;
      margin-top: 20px;
      display: none;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status-message.show {
      display: block;
    }

    .help-text {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Avatar Overlay Settings</h1>
    <p class="subtitle">Configure your animated avatar assistant</p>

    <div class="section">
      <h2 class="section-title">General Settings</h2>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="enabled" checked>
          <label for="enabled">Enable Avatar Overlay</label>
        </div>
      </div>

      <div class="form-group">
        <label for="avatarStyle">Avatar Style</label>
        <select id="avatarStyle">
          <option value="default">Default</option>
          <option value="minimal">Minimal</option>
          <option value="animated">Animated</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Emotion Analysis (Optional)</h2>

      <div class="form-group">
        <label for="llmProvider">LLM Provider</label>
        <select id="llmProvider">
          <option value="none">None (Basic Mode)</option>
          <option value="gemini">Google Gemini</option>
          <option value="openai">OpenAI</option>
        </select>
        <div class="help-text">
          Select an LLM provider to enable advanced emotion detection
        </div>
      </div>

      <div id="llmConfig" class="hidden">
        <div class="form-group">
          <label for="apiKey">API Key</label>
          <input type="password" id="apiKey" placeholder="Enter your API key">
          <div class="help-text">
            Your API key is stored securely and never shared
          </div>
        </div>

        <div class="form-group">
          <label for="modelName">Model Name (Optional)</label>
          <input type="text" id="modelName" placeholder="e.g., gemini-pro or gpt-3.5-turbo">
          <div class="help-text">
            Leave empty to use the default model
          </div>
        </div>
      </div>
    </div>

    <div class="button-group">
      <button type="button" class="btn-primary" id="saveBtn">Save Settings</button>
      <button type="button" class="btn-secondary" id="resetBtn">Reset to Defaults</button>
    </div>

    <div id="statusMessage" class="status-message"></div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
